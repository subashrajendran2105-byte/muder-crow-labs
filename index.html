<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Murder Crow Labs</title><style>body{margin:0;font-family:Arial,sans-serif} .mcl-bubble{position:fixed;z-index:99999;width:78px;height:78px;border-radius:50%;right:18%;top:35%;cursor:pointer;pointer-events:auto;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.9),rgba(255,255,255,.18) 28%,rgba(180,220,215,.12) 58%,rgba(255,255,255,.5));border:1px solid rgba(255,255,255,.9);box-shadow:inset -10px -12px 18px rgba(30,60,55,.12),inset 8px 7px 13px rgba(255,255,255,.8),0 12px 30px rgba(0,0,0,.16);backdrop-filter:blur(3px);animation:mclFloat 5s ease-in-out infinite}.mcl-bubble:before{content:"";position:absolute;width:25px;height:10px;left:16px;top:14px;border-radius:50%;background:rgba(255,255,255,.8);filter:blur(2px);transform:rotate(-25deg)}@keyframes mclFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-28px,-24px,0)}}.mcl-bubble.pop{animation:mclPop .38s ease-out forwards}@keyframes mclPop{0%{transform:scale(1);opacity:1}35%{transform:scale(1.25);opacity:.8}100%{transform:scale(.05);opacity:0}}@media(max-width:700px){.mcl-bubble{width:64px;height:64px;right:14%;top:38%}}</style><link rel="stylesheet" href="/menu.css">
<script defer src="/menu.js"></script>
</head><body><div class="mcl-bubble" aria-label="Interactive bubble"></div><script>const b=document.querySelector('.mcl-bubble');let popped=false;function pop(){if(popped)return;popped=true;b.classList.add('pop');setTimeout(()=>{b.classList.remove('pop');popped=false},900)}b.addEventListener('click',pop);window.addEventListener('scroll',()=>{if(window.scrollY+innerHeight>=document.documentElement.scrollHeight-180)pop()},{passive:true});</script></body></html>
