name: Remove first-interaction crow sound

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Remove first-interaction crow sound complete') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove old first-interaction sound
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('menu.js')
          text = p.read_text(encoding='utf-8')
          pattern = re.compile(r'\n// Murder Crow brand sound:.*?\n// Murder Crow offer countdown', re.S)
          replacement = '\n// Murder Crow offer countdown'
          new, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Old first-interaction sound block not found')
          p.write_text(new, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu.js
          git rm .github/workflows/remove-first-crow-sound.yml
          git commit -m "Remove first-interaction crow sound complete"
          git push
