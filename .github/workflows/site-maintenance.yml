name: Murder Crow Labs site maintenance
on:
  push:
    branches: [main]
    paths:
      - 'scripts/site-maintenance.py'
      - '.github/workflows/site-maintenance.yml'
permissions:
  contents: write
jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update pages, SEO library and redirects
        run: python scripts/site-maintenance.py
      - name: Commit maintenance changes
        run: |
          git config user.name "murder-crow-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Maintain Murder Crow site and expand editorial library"
          git push origin HEAD:main
