name: Murder Crow Learn Hub
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/inject-learn-hub.py
      - name: Commit Learn hub changes
        run: |
          git config user.name "murder-crow-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Murder Crow Learn hub"
          git pull --rebase origin main
          git push origin HEAD:main
