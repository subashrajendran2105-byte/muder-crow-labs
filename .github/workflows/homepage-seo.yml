name: Murder Crow homepage SEO

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.html'

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply homepage SEO
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<title>.*?</title>', '<title>Murder Crow Labs | Digital Marketing & Growth Marketing</title>', s, count=1, flags=re.S)
          s = re.sub(r'<meta name="description"[^>]*>', '<meta name="description" content="Murder Crow Labs is a practical digital marketing and growth marketing lab covering SEO, AEO, GEO, social media marketing, Meta Ads, Google Ads, AI marketing, analytics, CRM and career-focused learning.">', s, count=1, flags=re.S)
          tags = '''\n<link rel="canonical" href="https://mudercrowlabs.in/">\n<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">\n<meta property="og:type" content="website">\n<meta property="og:url" content="https://mudercrowlabs.in/">\n<meta property="og:title" content="Murder Crow Labs | Digital Marketing & Growth Marketing">\n<meta property="og:description" content="Learn how growth works through practical digital marketing, SEO, AEO, GEO, AI, advertising, analytics, CRM and real-world projects.">\n<meta property="og:site_name" content="Murder Crow Labs">\n<meta name="twitter:card" content="summary_large_image">\n<meta name="twitter:title" content="Murder Crow Labs | Digital Marketing & Growth Marketing">\n<meta name="twitter:description" content="A practical growth lab for digital marketing, SEO, AEO, GEO, AI marketing, advertising, analytics and CRM.">\n<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://mudercrowlabs.in/#organization","name":"Murder Crow Labs","url":"https://mudercrowlabs.in/","description":"A practical creative and growth lab focused on digital marketing, growth marketing, SEO, AEO, GEO, AI, advertising, analytics and CRM."},{"@type":"WebSite","@id":"https://mudercrowlabs.in/#website","url":"https://mudercrowlabs.in/","name":"Murder Crow Labs","publisher":{"@id":"https://mudercrowlabs.in/#organization"},"inLanguage":"en-IN"},{"@type":"WebPage","@id":"https://mudercrowlabs.in/#webpage","url":"https://mudercrowlabs.in/","name":"Murder Crow Labs | Digital Marketing & Growth Marketing","isPartOf":{"@id":"https://mudercrowlabs.in/#website"},"about":{"@id":"https://mudercrowlabs.in/#organization"},"description":"Practical digital marketing and growth marketing learning covering SEO, AEO, GEO, social media, paid advertising, AI, analytics and CRM.","inLanguage":"en-IN"}]}</script>\n'''
          if 'property="og:type"' not in s:
              s = s.replace('</head>', tags + '</head>', 1)
          if '/menu.css' not in s:
              s = s.replace('</head>', '  <link rel="stylesheet" href="/menu.css">\n</head>', 1)
          if '/favicon.svg' not in s:
              s = s.replace('</head>', '  <link rel="icon" href="/favicon.svg" type="image/svg+xml">\n</head>', 1)
          if '/menu.js' not in s:
              s = s.replace('</head>', '  <script defer src="/menu.js"></script>\n</head>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit SEO changes
        run: |
          git config user.name "murder-crow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Improve homepage SEO"
          git push
